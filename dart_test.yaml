# Test configuration - automatically used by flutter test
tags:
  # Performance tiers
  critical:
    timeout: 30s
  unit:
    timeout: 10s
  slow:
    timeout: 5m
  
  # Test categories (used alongside critical/unit/slow tags)
  blocs:
    # BLoC and state management tests
    # Example: @Tags(['unit', 'blocs'])
  services:
    # Service layer tests (API, database, external services)
    # Example: @Tags(['unit', 'services'])
  models:
    # Data model and business logic tests
    # Example: @Tags(['unit', 'models'])
  widgets:
    # Widget and UI component tests
    # Example: @Tags(['unit', 'widgets'])
  pages:
    # Full page/screen tests
    # Example: @Tags(['unit', 'pages'])
  onboarding:
    # Onboarding flow tests
    # Example: @Tags(['unit', 'onboarding'])
  controllers:
    # Controller tests (audio, TTS, etc.)
    # Example: @Tags(['unit', 'controllers'])
  providers:
    # Provider tests (state management)
    # Example: @Tags(['unit', 'providers'])
  features:
    # User flow and feature tests
    # Example: @Tags(['unit', 'features'])
  utils:
    # Utility and helper function tests
    # Example: @Tags(['unit', 'utils'])
  notes:
    # Devotional and Bible note feature tests (cross-cuts blocs/widgets/pages/models/repositories)
    # Example: @Tags(['unit', 'widgets', 'notes'])
  iap:
    # In-app purchase tests
    # Example: @Tags(['unit', 'iap'])
  supporter:
    # Supporter/IAP feature tests
    # Example: @Tags(['unit', 'supporter'])
  backup:
    # Backup and restore flow tests
    # Example: @Tags(['unit', 'services', 'backup'])
  repositories:
    # Repository layer tests (data access, caching, network)
    # Example: @Tags(['unit', 'repositories'])
  helpers:
    # Cross-layer helper and navigation orchestration tests
    # Example: @Tags(['unit', 'helpers'])
  android:
    # Android platform behavior tests
  extensions:
    # Dart extension method tests
  favorites:
    # Favorites feature tests
  navigation:
    # Deep-link and in-app navigation tests
  notifications:
    # Notification feature tests
  translations:
    # Localization resource and translation tests
  tts:
    # Text-to-speech feature tests

  integration:
    # Integration tests across multiple components
    # Example: @Tags(['integration'])
    timeout: 2m
  behavioral:
    # Real user behavior and journey tests
    # Example: @Tags(['behavioral'])
    timeout: 2m
  
  # Legacy tag (kept for backward compatibility)
  bloc:
    # Deprecated: Use 'blocs' instead

# Default timeout for untagged tests
timeout: 1m
