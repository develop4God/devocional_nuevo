# Optimizado para 16GB RAM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator.
# Built-in Kotlin (android.builtInKotlin=true) cannot be enabled yet:
# - AGP 9.x bundles built-in Kotlin 2.2.10, below Flutter 3.47's minimum of 2.2.20
# - The Flutter Gradle plugin crashes (ClassCastException) with android.newDsl=true
# Revisit when a Flutter/AGP release raises the built-in Kotlin version. See issue #314.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
