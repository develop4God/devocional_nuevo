name: CodeQL (Java/Kotlin)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android/**'
  schedule:
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          echo "Reclaiming disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force
          sudo docker builder prune -a --force
          df -h

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Android app (debug)
        # gradle.properties is a plain Java .properties file: a repeated key
        # overrides the earlier one, it doesn't merge. Rewrite the existing
        # org.gradle.jvmargs line's -Xmx in place (keeping its other flags —
        # MaxMetaspaceSize, ReservedCodeCacheSize, module-opens) rather than
        # appending a second line or using GRADLE_OPTS (which would replace
        # the whole jvmargs value, dropping those flags). Raises the heap
        # from 3072m to 4096m for CodeQL's manual build-mode tracing, which
        # adds memory overhead on top of the normal build and was OOMing
        # during the Jetifier transform step (JetifyTransform: Java heap
        # space) at the existing heap size. Scoped to this CI job only —
        # local/other CI builds keep the original 3072m default.
        run: |
          sed -i 's/-Xmx3072m/-Xmx4096m/' android/gradle.properties
          flutter build apk --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
